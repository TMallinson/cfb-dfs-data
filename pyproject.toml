[project]
name = "cfb-dfs-data"
version = "0.1.0"
description = "College football DFS data pipeline -> Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "google-auth>=2.30",
    "google-api-python-client>=2.140",
    "scikit-learn>=1.5",
    "tenacity>=8.3",
    "structlog>=24",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.scripts]
cfb-dfs = "cfb_dfs.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfb_dfs"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "N", "RUF"]
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real network services (deselected by default)"]

[tool.mypy]
python_version = "3.11"
packages = ["cfb_dfs"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
